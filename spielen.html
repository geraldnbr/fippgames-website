/* Single dark look on purpose: a lantern-lit cave screen centred on a void, pixel-scaled canvas */
:root {
  --void: #070401;
  --soot: #120c05;
  --moss: #676e44;
  --sage: #9aac88;
  --bone: #d0d8b4;
  --brass: #d6a24a;
  --font-pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--bone);
  font-family: var(--font-pixel);
  overflow: hidden;
}
#wrap {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  max-width: 100%;
  box-shadow: 0 0 0 1px var(--soot);
}
canvas:focus-visible { box-shadow: 0 0 0 2px var(--brass); }
#codebox { position: absolute; display: flex; gap: 6px; align-items: center; }
#codebox[hidden] { display: none; }
#codebox input { font-family: var(--font-pixel); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; width: 9.5em; padding: 6px 8px; background: var(--soot); color: var(--bone); border: 1px solid var(--moss); border-radius: 0; }
#codebox input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
#codebox button { font-family: var(--font-pixel); font-size: 12px; padding: 7px 10px; background: var(--brass); color: var(--void); border: 1px solid var(--bone); border-radius: 0; cursor: pointer; }
#codebox button:focus-visible { outline: 2px solid var(--bone); outline-offset: 1px; }
#legal-ov { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--void); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#legal-ov[hidden] { display: none; }
#legal-ov .legal-bar { padding: 8px 16px; border-bottom: 1px solid var(--moss); }
#legal-ov button { font-family: var(--font-pixel); font-size: 12px; padding: 10px 12px; background: var(--brass); color: var(--void); border: 1px solid var(--bone); border-radius: 0; cursor: pointer; }
#legal-ov iframe { flex: 1; width: 100%; border: 0; background: #f4f1e8; }
#loading { position: absolute; color: var(--sage); font-size: 12px; letter-spacing: 0.08em; }
</style>

window.ECHOLOT_CONFIG = {"_hinweis":"Nur diese Datei ausfüllen. testMode false = echte Werbung. Für Test-Builds in GitHub beim Start \"testanzeigen\" anhaken (dann laufen Google-Testanzeigen, auch mit den echten IDs).","testMode":true,"admob":{"iosAppId":"ca-app-pub-6076511892879087~7774529644","androidAppId":"ca-app-pub-3940256099942544~3347511713","iosRewardedId":"ca-app-pub-6076511892879087/2226815801","androidRewardedId":"ca-app-pub-3940256099942544/5224354917","iosInterstitialId":"ca-app-pub-6076511892879087/8896039620","androidInterstitialId":"ca-app-pub-3940256099942544/1033173712"},"leaderboards":{"iosSeason":"echolot.saison","iosRecord":"echolot.rekord","androidSeason":"PLAY_GAMES_SAISON_ID","androidRecord":"PLAY_GAMES_REKORD_ID","playGamesProjectId":"000000000000"},"products":{"werbefrei":"de.fippgames.echolot.werbefrei","skinpaket":"de.fippgames.echolot.skinpaket"},"links":{"datenschutz":"https://fippgames.com/datenschutz.html","impressum":"https://fippgames.com/impressum.html","support":"mailto:support@fippgames.com"},"anbieter":{"firma":"","name":"Gerald Neubauer","strasse":"Thalkirchner Straße 29","ort":"80337 München","land":"Deutschland","email":"support@fippgames.com","telefon":"+49 176 48074405","ustid":"","stand":"Oktober 2026","wirtschaftsid":""},"_hinweis_anbieter":"Einzelunternehmen: 'name' = dein Vor- und Nachname (Pflicht). 'firma' = Geschäftsbezeichnung, falls du eine nutzt (optional). 'ustid' oder 'wirtschaftsid' eintragen, falls vorhanden.","zwischenwerbung":{"_hinweis":"Vollbild-Video nach geschafften Levels. aktiv=false schaltet sie ab.","aktiv":true,"alleLevelMin":3,"alleLevelMax":5,"mindestMinuten":4,"ersteLevelOhne":3},"version":"1.0.0"};
/* Echolot – Plattform-Schicht.
 * Verbindet das Spiel mit Werbung (AdMob + Einwilligung), Käufen (App Store / Google Play),
 * Ranglisten (Game Center / Google Play Games) und dauerhaftem Speicher.
 * Im Browser (ohne Capacitor) gibt es harmlose Ersatzlösungen, damit das Spiel überall läuft.
 */
(function () {
  "use strict";
  const CFG = window.ECHOLOT_CONFIG || {
    testMode: true, admob: {}, leaderboards: {}, products: { werbefrei: "werbefrei", skinpaket: "skinpaket" }, links: {}
  };
  const Cap = window.Capacitor;
  const native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  const os = native ? Cap.getPlatform() : "web";
  // registerPlugin kommt aus @capacitor/core (www/capacitor.js). Dessen Proxys liefern bei addListener ein Promise.
  const reg = (window.capacitorExports && window.capacitorExports.registerPlugin) || (Cap && Cap.registerPlugin) || null;
  const plugin = name => {
    if (!native) return null;
    try { return (reg ? reg(name) : null) || (Cap.Plugins && Cap.Plugins[name]) || null; } catch (e) { return (Cap.Plugins && Cap.Plugins[name]) || null; }
  };
  /** Listener sicher anmelden: funktioniert, egal ob addListener ein Promise oder direkt ein Handle liefert. */
  const listen = (pl, ev, fn) => {
    if (!pl || !pl.addListener) return Promise.resolve(null);
    try { return Promise.resolve(pl.addListener(ev, fn)).catch(() => null); } catch (e) { return Promise.resolve(null); }
  };
  const withTimeout = (p, ms, v) => Promise.race([p, new Promise(r => setTimeout(() => r(v), ms))]);
  const AdMob = plugin("AdMob"), Purchases = plugin("NativePurchases"), Games = plugin("EcholotGames"),
    Prefs = plugin("Preferences"), App = plugin("App"), Splash = plugin("SplashScreen"), LN = plugin("LocalNotifications");
  const SAVE_KEY = "echolot-save-v2";
  const log = (...a) => { try { console.log("[Echolot]", ...a); } catch (e) {} };

  /* ---------- Speicher: localStorage + nativer Spiegel (übersteht iOS-Speicherbereinigung) ---------- */
  const storage = {
    async restore() {
      if (!Prefs) return;
      try {
        const r = await Prefs.get({ key: SAVE_KEY });
        let local = null; try { local = localStorage.getItem(SAVE_KEY); } catch (e) {}
        if (r && r.value && (!local || local.length < 10)) { try { localStorage.setItem(SAVE_KEY, r.value); } catch (e) {} }
      } catch (e) { log("restore", e); }
    },
    mirror(json) { if (Prefs) Prefs.set({ key: SAVE_KEY, value: json }).catch(() => {}); }
  };

  /* ---------- Werbung (nur freiwillige Belohnungsvideos) ----------
   * Ablauf: Beim Start nur die Einwilligungsabfrage (Google UMP). Das Werbe-SDK selbst wird erst
   * gestartet und ein Video erst geladen, wenn die Spielerin/der Spieler zum ersten Mal ein Video startet.
   * Wer "Werbefrei" gekauft hat, bekommt weder Einwilligungsfenster noch Tracking-Abfrage. */
  const ads = {
    consentDone: false, inited: false, canRequest: false, privacyOptions: false,
    ageSet: false, underAge: false, child: false, initUnder: false, initChild: false,
    loaded: false, loadedAt: 0, loading: null, consenting: null, lastFullAdAt: 0,
    get available() { return !!AdMob; },
    /** Altersgruppe setzen – immer beim Start, auch bei "Werbefrei". Ohne Altersangabe wird keine Werbung angefragt.
     * Wird jemand jünger eingestuft, werden vorgeladene Videos verworfen und die strengeren Kennzeichen sofort gesetzt. */
    setAge(opts) {
      const under = !!(opts && (opts.underAge || opts.child)), child = !!(opts && opts.child);
      const stricter = ads.ageSet && ((under && !ads.underAge) || (child && !ads.child));
      ads.underAge = under; ads.child = child; ads.ageSet = true;
      if (stricter) {
        ads.loaded = false; ads.interLoaded = false; ads.consentDone = false;
        if (ads.inited && AdMob) {
          AdMob.initialize({ initializeForTesting: !!CFG.testMode, tagForUnderAgeOfConsent: true, tagForChildDirectedTreatment: ads.child || ads.initChild, maxAdContentRating: (ads.child || ads.initChild) ? "General" : "ParentalGuidance" })
            .then(() => { ads.initUnder = true; ads.initChild = ads.child || ads.initChild; }).catch(e => log("re-init", e));
        }
      }
    },
    /** Einwilligung abfragen (bei 16+ ggf. Formular). Ruft KEIN Werbe-SDK auf. */
    consent(opts) {
      if (!AdMob) return Promise.resolve();
      if (opts) ads.setAge(opts);
      if (!ads.ageSet) return Promise.resolve();
      if (ads.consenting) return ads.consenting;
      ads.consenting = (async () => {
        try {
          let info = await AdMob.requestConsentInfo({ tagForUnderAgeOfConsent: ads.underAge });
          if (!ads.underAge && info.isConsentFormAvailable && info.status === "REQUIRED") info = await AdMob.showConsentForm();
          ads.canRequest = !!info.canRequestAds;
          ads.privacyOptions = info.privacyOptionsRequirementStatus === "REQUIRED";
        } catch (e) { log("consent", e); ads.canRequest = false; }
        ads.consentDone = true; ads.consenting = null;
      })();
      return ads.consenting;
    },
    init(opts) { return ads.consent(opts); },
    /** Startet das Werbe-SDK (einmal). opts.att: Apple-Tracking-Abfrage erlaubt (nur wenn die Person selbst ein Video startet, ab 16). */
    async ensureInit(opts) {
      if (!AdMob || !ads.ageSet || !ads.canRequest) return false;
      if (!ads.inited) {
        try {
          // Strengere Kennzeichen bleiben bis zum Neustart, auch wenn das Alter später älter eingestellt wird.
          await AdMob.initialize({ initializeForTesting: !!CFG.testMode, tagForUnderAgeOfConsent: ads.underAge, tagForChildDirectedTreatment: ads.child, maxAdContentRating: ads.child ? "General" : "ParentalGuidance" });
          ads.inited = true; ads.initUnder = ads.underAge; ads.initChild = ads.child;
        } catch (e) { log("ads init", e); return false; }
      }
      if (opts && opts.att && os === "ios" && !ads.underAge && !ads.initUnder) {
        try { const st = await AdMob.trackingAuthorizationStatus(); if (st && st.status === "notDetermined") await AdMob.requestTrackingAuthorization(); } catch (e) { log("att", e); }
      }
      return ads.inited;
    },
    npa() { return ads.underAge || ads.initUnder; },
    adId() { return os === "ios" ? CFG.admob.iosRewardedId : CFG.admob.androidRewardedId; },
    preload() {
      if (!AdMob || !ads.inited || !ads.canRequest || ads.loading) return ads.loading;
      if (ads.loaded && Date.now() - ads.loadedAt < 55 * 60000) return null;
      ads.loaded = false;
      ads.loading = AdMob.prepareRewardVideoAd({ adId: ads.adId(), isTesting: !!CFG.testMode, npa: ads.npa() })
        .then(() => { ads.loaded = true; ads.loadedAt = Date.now(); }).catch(e => { log("ad load", e); ads.loaded = false; }).finally(() => { ads.loading = null; });
      return ads.loading;
    },
    /** Zeigt ein Belohnungsvideo. Ergebnis: "ok" (Belohnung verdient), "closed" (vorzeitig geschlossen), "nofill" (kein Video verfügbar). */
    showRewarded() {
      if (!AdMob) return Promise.resolve("nofill");
      return new Promise(async resolve => {
        let rewarded = false, done = false, shown = false; const hs = [];
        const finish = v => { if (done) return; done = true; hs.forEach(h => { try { h && h.remove && h.remove(); } catch (e) {} }); ads.loaded = false; if (shown) ads.lastFullAdAt = Date.now(); if (v === "ok") setTimeout(() => ads.preload(), 800); resolve(v); };
        try {
          if (!ads.ageSet) { finish("nofill"); return; }
          if (!ads.consentDone || !ads.canRequest) await ads.consent();
          if (!ads.canRequest || !(await ads.ensureInit({ att: true }))) { finish("nofill"); return; }
          hs.push(await listen(AdMob, "onRewardedVideoAdReward", () => { rewarded = true; }));
          hs.push(await listen(AdMob, "onRewardedVideoAdShowed", () => { shown = true; ads.lastFullAdAt = Date.now(); }));
          hs.push(await listen(AdMob, "onRewardedVideoAdDismissed", () => setTimeout(() => finish(rewarded ? "ok" : "closed"), 250)));
          hs.push(await listen(AdMob, "onRewardedVideoAdFailedToShow", () => finish("nofill")));
          if (!ads.loaded || Date.now() - ads.loadedAt > 55 * 60000) { ads.loaded = false; await withTimeout(ads.preload() || Promise.resolve(), 12000); }
          if (!ads.loaded) { finish("nofill"); return; }
          AdMob.showRewardVideoAd().then(() => { rewarded = true; }).catch(() => finish(shown ? (rewarded ? "ok" : "closed") : "nofill"));
          setTimeout(() => { if (!shown) finish("nofill"); }, 8000);
          setTimeout(() => finish(rewarded ? "ok" : shown ? "closed" : "nofill"), 180000);
        } catch (e) { log("ad show", e); finish("nofill"); }
      });
    },
    /* Vollbild-Video zwischen zwei Levels (nur an natürlichen Pausen, Regeln im Spiel). Keine Tracking-Abfrage auf diesem Weg. */
    interLoaded: false, interLoadedAt: 0, interLoading: null,
    interId() { return os === "ios" ? CFG.admob.iosInterstitialId : CFG.admob.androidInterstitialId; },
    get interReady() { return ads.interLoaded && Date.now() - ads.interLoadedAt < 55 * 60000; },
    async preloadInterstitial() {
      if (!AdMob || !ads.ageSet || ads.interReady || ads.interLoading) return ads.interLoading;
      if (!ads.consentDone) await ads.consent();
      if (!ads.canRequest || !ads.interId() || !(await ads.ensureInit({ att: false }))) return null;
      ads.interLoaded = false;
      ads.interLoading = AdMob.prepareInterstitial({ adId: ads.interId(), isTesting: !!CFG.testMode, npa: ads.npa() })
        .then(() => { ads.interLoaded = true; ads.interLoadedAt = Date.now(); }).catch(e => { log("inter load", e); ads.interLoaded = false; }).finally(() => { ads.interLoading = null; });
      return ads.interLoading;
    },
    /** Zeigt das vorgeladene Vollbild-Video. Ergebnis: true = wirklich gezeigt und geschlossen. */
    showInterstitial() {
      if (!AdMob || !ads.interReady) return Promise.resolve(false);
      return new Promise(async resolve => {
        let done = false, shown = false; const hs = [];
        const finish = v => { if (done) return; done = true; hs.forEach(h => { try { h && h.remove && h.remove(); } catch (e) {} }); ads.interLoaded = false; if (shown) ads.lastFullAdAt = Date.now(); resolve(v); };
        try {
          hs.push(await listen(AdMob, "interstitialAdShowed", () => { shown = true; ads.lastFullAdAt = Date.now(); }));
          hs.push(await listen(AdMob, "interstitialAdDismissed", () => finish(true)));
          hs.push(await listen(AdMob, "interstitialAdFailedToShow", () => finish(false)));
          AdMob.showInterstitial().catch(() => finish(false));
          setTimeout(() => { if (!shown) finish(false); }, 6000);
          setTimeout(() => finish(shown), 120000);
        } catch (e) { log("inter show", e); finish(false); }
      });
    },
    async showPrivacyOptions() {
      if (!AdMob) return false;
      try {
        if (!ads.consentDone) await ads.consent();
        if (!ads.privacyOptions) return false;
        await AdMob.showPrivacyOptionsForm();
        const info = await AdMob.requestConsentInfo({ tagForUnderAgeOfConsent: ads.underAge }); ads.canRequest = !!info.canRequestAds;
        return true;
      } catch (e) { log("privacy form", e); return false; }
    }
  };

  /* ---------- Käufe (Einmalkäufe, keine Abos, keine Zufallsinhalte) ---------- */
  const iap = {
    prices: {}, owned: [], busy: false, synced: false, lastError: "",
    get available() { return !!Purchases; },
    key2id(key) { return CFG.products[key]; },
    id2key(id) { return Object.keys(CFG.products).find(k => CFG.products[k] === id); },
    async init() {
      if (!Purchases) return;
      try {
        const ids = Object.values(CFG.products);
        const r = await Purchases.getProducts({ productIdentifiers: ids, productType: "inapp" });
        (r.products || []).forEach(p => { const k = iap.id2key(p.identifier); if (k) iap.prices[k] = p.priceString; });
      } catch (e) { log("products", e); }
      await iap.refreshOwned();
    },
    async refreshOwned() {
      if (!Purchases) return iap.owned;
      try {
        const r = await Purchases.getPurchases({ productType: "inapp", onlyCurrentEntitlements: true });
        const keys = (r.purchases || []).filter(t => !t.revocationDate && t.purchaseState !== "2" && t.purchaseState !== "PENDING").map(t => iap.id2key(t.productIdentifier)).filter(Boolean);
        iap.owned = Array.from(new Set(keys)); iap.synced = true;
      } catch (e) { log("purchases", e); }
      return iap.owned;
    },
    async buy(key) {
      if (!Purchases || iap.busy) return false;
      iap.busy = true;
      try {
        const t = await Purchases.purchaseProduct({ productIdentifier: iap.key2id(key), productType: "inapp", quantity: 1 });
        iap.lastError = "";
        if (t && t.productIdentifier) { if (!iap.owned.includes(key)) iap.owned.push(key); return true; }
        return false;
      } catch (e) { log("buy", e); iap.lastError = String((e && (e.message || e.code)) || e || ""); return false; } finally { iap.busy = false; }
    },
    async restore() {
      if (!Purchases) return [];
      try { await Purchases.restorePurchases(); } catch (e) { log("restore", e); }
      return iap.refreshOwned();
    }
  };

  /* ---------- Ranglisten ---------- */
  // Punktzahl = Tiefe * 10000 + (9999 - Sekunden): tiefer zählt, bei gleicher Tiefe gewinnt die kürzere Zeit.
  const encodeScore = (depth, secs) => Math.max(0, Math.floor(depth)) * 10000 + Math.max(0, 9999 - Math.min(9999, Math.round(secs)));
  const decodeScore = s => ({ depth: Math.floor(s / 10000), secs: 9999 - (s % 10000) });
  // Google Play Games: Wochenwertung endet Samstag 24:00 Uhr Pazifikzeit (= Sonntag ~8/9 Uhr MEZ).
  function playWeek(now = new Date()) {
    const pt = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
    const offset = Math.round((now.getTime() - pt.getTime()) / 60000) * 60000;
    const start = new Date(pt); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - start.getDay());
    const pad = n => String(n).padStart(2, "0");
    const id = start.getFullYear() + "-" + pad(start.getMonth() + 1) + "-" + pad(start.getDate());
    return { seasonId: "gp-" + id, endsAt: start.getTime() + offset + 7 * 864e5 };
  }
  const games = {
    signedIn: false, player: null, os,
    get available() { return !!Games; },
    seasonBoardId() { return os === "ios" ? CFG.leaderboards.iosSeason : CFG.leaderboards.androidSeason; },
    recordBoardId() { return os === "ios" ? CFG.leaderboards.iosRecord : CFG.leaderboards.androidRecord; },
    async signIn() {
      if (!Games) return false;
      try { const r = await Games.signIn(); games.signedIn = !!(r && r.signedIn); games.player = r; } catch (e) { games.signedIn = false; log("signIn", e); }
      return games.signedIn;
    },
    async submit(depth, secs) {
      if (!Games || !games.signedIn) return false;
      try { await Games.submitScore({ score: encodeScore(depth, secs), leaderboardIds: [games.seasonBoardId(), games.recordBoardId()] }); return true; } catch (e) { log("submit", e); return false; }
    },
    /** Aktuelle Saison: {entries:[{rank,name,depth,secs,me}], me, endsAt, seasonId} */
    async loadSeason(count = 10) {
      if (!Games || !games.signedIn) return null;
      try {
        const r = await Games.loadBoard({ leaderboardId: games.seasonBoardId(), count, span: "weekly" });
        const myId = games.player && games.player.playerId;
        const map = e => Object.assign({ rank: e.rank, name: e.name, me: !!e.me || (myId && e.playerId === myId) }, decodeScore(e.score));
        const out = { entries: (r.entries || []).map(map), me: r.me ? map(Object.assign({}, r.me, { me: true })) : null };
        if (os === "ios") { out.endsAt = r.endsAt || null; out.seasonId = r.seasonId || null; }
        else Object.assign(out, playWeek());
        return out;
      } catch (e) { log("loadSeason", e); return null; }
    },
    /** iOS: Platz in der Vorwoche. Android: {supported:false} – das Spiel nutzt dann den zuletzt gesehenen Platz. */
    async previousRank() {
      if (!Games || !games.signedIn) return null;
      try { return await Games.loadPreviousRank({ leaderboardId: games.seasonBoardId() }); } catch (e) { log("prevRank", e); return null; }
    },
    currentWeekFallback: playWeek,
    async show() { if (Games) { try { await Games.showBoard({ leaderboardId: games.seasonBoardId() }); } catch (e) { log("showBoard", e); } } }
  };

  /* ---------- Erinnerungen von Fipp (lokale Benachrichtigungen, nur auf dem Gerät geplant) ----------
   * Wichtig: LocalNotifications.schedule() fragt ab Version 8.3 selbst nach der Erlaubnis. Deshalb wird nur
   * geplant, wenn die Erlaubnis bereits erteilt ist – gefragt wird ausschließlich über request(). */
  const notify = {
    get available() { return !!LN; },
    async status() { if (!LN) return "denied"; try { const r = await LN.checkPermissions(); return (r && r.display) || "denied"; } catch (e) { return "denied"; } },
    async request() { if (!LN) return false; try { const r = await LN.requestPermissions(); return !!r && r.display === "granted"; } catch (e) { log("notify perm", e); return false; } },
    /** Ersetzt alle geplanten Erinnerungen durch list = [{id, title, body, at: Date}]. */
    async replace(list) {
      if (!LN) return;
      try {
        const p = await LN.getPending();
        if (p && p.notifications && p.notifications.length) await LN.cancel({ notifications: p.notifications.map(n => ({ id: n.id })) });
        if (!list || !list.length || (await notify.status()) !== "granted") return;
        await LN.schedule({ notifications: list.map(n => ({ id: n.id, title: n.title, body: n.body, schedule: { at: n.at, allowWhileIdle: true } })) });
      } catch (e) { log("notify", e); }
    }
  };

  /* ---------- Rechtstexte im Spiel ---------- */
  function openLegal(which) {
    const file = which === "impressum" ? "impressum.html" : which === "agb" ? "nutzungsbedingungen.html" : "datenschutz.html";
    let url = null;
    if (native) url = "legal/" + file;
    else if (window.ECHOLOT_LEGAL_BASE != null) url = window.ECHOLOT_LEGAL_BASE + file;
    else if (CFG.links && CFG.links[which] && !/DEIN-/.test(CFG.links[which])) url = CFG.links[which];
    if (!url) return false;
    let ov = document.getElementById("legal-ov");
    if (!ov) {
      ov = document.createElement("div"); ov.id = "legal-ov";
      const en = window.ECHOLOT_LANG === "en";
      ov.innerHTML = '<div class="legal-bar"><button type="button" id="legal-close">' + (en ? "← BACK TO THE GAME" : "← ZURÜCK ZUM SPIEL") + '</button></div><iframe id="legal-frame" title="' + (en ? "Legal" : "Rechtliches") + '"></iframe>';
      document.body.appendChild(ov);
      document.getElementById("legal-close").addEventListener("click", () => { ov.hidden = true; document.getElementById("legal-frame").src = "about:blank"; });
    }
    document.getElementById("legal-frame").src = url + (window.ECHOLOT_LANG === "en" && which !== "impressum" ? "#en" : "");
    ov.hidden = false;
    return true;
  }

  /* ---------- Android-Zurück-Taste ---------- */
  function hookBack(handler) { listen(App, "backButton", () => handler()); }
  // Käufe, die später freigegeben werden (z. B. Familienfreigabe "Kaufanfrage") oder zurückerstattet wurden
  function hookPurchases() { listen(Purchases, "transactionUpdated", () => { iap.refreshOwned().then(() => { try { window.dispatchEvent(new Event("echolot-iap")); } catch (e) {} }); }); }
  function exitApp() { if (App && App.exitApp) App.exitApp(); }

  window.Platform = {
    native, os, config: CFG, storage, ads, iap, games, notify, openLegal, hookBack, exitApp, encodeScore, decodeScore,
    version: CFG.version || "1.0.0",
    hideSplash() { if (Splash) Splash.hide().catch(() => {}); },
    /** Wird vom Spiel nach dem Laden aufgerufen. */
    async start(opts) {
      if (!native) return;
      hookPurchases();
      try { await withTimeout(iap.init(), 8000); } catch (e) { log("iap start", e); }
      if (opts && opts.ageKnown) ads.setAge({ underAge: opts.underAge, child: opts.child });
      const adFree = !!(opts && opts.adFree) || iap.owned.includes("werbefrei");
      // Erst die Einwilligung (eigenes Fenster), danach Game Center – so überlagern sich die Fenster nicht.
      if (opts && opts.ageKnown && !adFree) { try { await withTimeout(ads.consent({ underAge: opts.underAge, child: opts.child }), 60000); } catch (e) { log("consent start", e); } }
      try { await withTimeout(games.signIn(), 20000, false); } catch (e) { log("gc start", e); }
    }
  };
})();
